<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#D9CFDD"/>
  <g fill="#241D28">
    <!-- corner finder patterns, like a real QR code -->
    <rect x="10" y="10" width="40" height="40" fill="none" stroke="#241D28" stroke-width="6"/>
    <rect x="24" y="24" width="12" height="12"/>
    <rect x="150" y="10" width="40" height="40" fill="none" stroke="#241D28" stroke-width="6"/>
    <rect x="164" y="24" width="12" height="12"/>
    <rect x="10" y="150" width="40" height="40" fill="none" stroke="#241D28" stroke-width="6"/>
    <rect x="24" y="164" width="12" height="12"/>
    <!-- scattered blocks to suggest QR noise, not a real payload -->
    <rect x="70" y="20" width="10" height="10"/><rect x="90" y="20" width="10" height="10"/>
    <rect x="110" y="30" width="10" height="10"/><rect x="70" y="40" width="10" height="10"/>
    <rect x="130" y="20" width="10" height="10"/><rect x="90" y="50" width="10" height="10"/>
    <rect x="20" y="70" width="10" height="10"/><rect x="40" y="80" width="10" height="10"/>
    <rect x="60" y="70" width="10" height="10"/><rect x="80" y="90" width="10" height="10"/>
    <rect x="100" y="70" width="10" height="10"/><rect x="120" y="80" width="10" height="10"/>
    <rect x="140" y="70" width="10" height="10"/><rect x="160" y="90" width="10" height="10"/>
    <rect x="170" y="70" width="10" height="10"/><rect x="30" y="100" width="10" height="10"/>
    <rect x="50" y="110" width="10" height="10"/><rect x="70" y="100" width="10" height="10"/>
    <rect x="90" y="120" width="10" height="10"/><rect x="110" y="100" width="10" height="10"/>
    <rect x="130" y="110" width="10" height="10"/><rect x="150" y="120" width="10" height="10"/>
    <rect x="70" y="140" width="10" height="10"/><rect x="90" y="150" width="10" height="10"/>
    <rect x="110" y="160" width="10" height="10"/><rect x="130" y="140" width="10" height="10"/>
    <rect x="150" y="150" width="10" height="10"/><rect x="170" y="140" width="10" height="10"/>
    <rect x="170" y="170" width="10" height="10"/><rect x="130" y="170" width="10" height="10"/>
  </g>
</svg>
